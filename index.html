<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="OUTSYNTH — Spatial music sequencer as pseudo-3D driving experience">
  <title>OUTSYNTH</title>
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
  <div id="outsynth-container">
    <!-- Background layer: sky, horizon, static elements -->
    <canvas id="bg-canvas"></canvas>
    <!-- Main layer: road, sprites, vehicle -->
    <canvas id="road-canvas"></canvas>
    <!-- HUD layer: feedback flashes, minimal indicators -->
    <canvas id="hud-canvas"></canvas>

    <!-- Start screen overlay -->
    <div id="start-screen">
      <div id="start-content">
        <h1 id="title">OUTSYNTH</h1>
        <p id="subtitle">spatial sequencer</p>
        <p id="start-prompt">press any key</p>
      </div>
    </div>
  </div>

  <!-- js-yaml from CDN (ESM) -->
  <script type="importmap">
  {
    "imports": {
      "js-yaml": "https://cdn.jsdelivr.net/npm/js-yaml@4.1.0/+esm"
    }
  }
  </script>

  <!-- Boot -->
  <script type="module" src="src/Game.js"></script>
</body>
</html>
