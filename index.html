<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="OUTSYNTH — Spatial music sequencer as pseudo-3D driving experience">
  <title>OUTSYNTH</title>
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
  <div id="outsynth-container">
    <!-- Background layer: sky, horizon, static elements -->
    <canvas id="bg-canvas"></canvas>
    <!-- Main layer: road, sprites, vehicle -->
    <canvas id="road-canvas"></canvas>
    <!-- HUD layer: feedback flashes, minimal indicators -->
    <canvas id="hud-canvas"></canvas>

    <!-- Start screen overlay -->
    <div id="start-screen">
      <div id="start-content">
        <h1 id="title">OUTSYNTH</h1>
        <p id="subtitle">spatial sequencer</p>
        <div id="accent-picker">
          <button class="accent-swatch active" data-color="#f5a623" style="background:#f5a623" title="Amber"></button>
          <button class="accent-swatch" data-color="#00ff88" style="background:#00ff88" title="Green"></button>
          <button class="accent-swatch" data-color="#ff3344" style="background:#ff3344" title="Red"></button>
          <button class="accent-swatch" data-color="#00cfff" style="background:#00cfff" title="Cyan"></button>
          <button class="accent-swatch" data-color="#ffffff" style="background:#ffffff" title="White"></button>
        </div>
        <p id="start-prompt">press any key</p>
      </div>
    </div>
  </div>

  <script>
    window._outsynthAccentColor = '#f5a623';
    document.addEventListener('DOMContentLoaded', () => {
      document.querySelectorAll('.accent-swatch').forEach(btn => {
        btn.addEventListener('click', (e) => {
          e.stopPropagation();
          window._outsynthAccentColor = btn.dataset.color;
          window.dispatchEvent(new CustomEvent('outsynth-accent-change', { detail: { color: btn.dataset.color } }));
          document.querySelectorAll('.accent-swatch').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
        });
      });
    });
  </script>

  <!-- js-yaml from CDN (ESM) -->
  <script type="importmap">
  {
    "imports": {
      "js-yaml": "https://cdn.jsdelivr.net/npm/js-yaml@4.1.0/+esm"
    }
  }
  </script>

  <!-- Boot -->
  <script type="module" src="src/Game.js"></script>
</body>
</html>
