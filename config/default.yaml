outsynth:
  version: "0.3.0"

  grid:
    steps: 128
    quantize: true

  lanes:
    count: 6
    snap_strength: 0.15
    width: 160

  vehicle:
    max_speed: 4167
    reverse_max_speed: 4167
    acceleration: 60
    deceleration: 120
    lateral_speed: 750
    inertia: 0.98

  track:
    default: "oval"
    draw_distance: 300

  audio:
    lookahead_ms: 100
    master_volume: 0.8

  start:
    mode: "press_any_key"

  display:
    target_fps: 60
    canvas_scale: 1

  accent_color: "#f5a623"
