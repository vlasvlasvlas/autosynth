theme:
  name: "Monochrome"

  sky:
    gradient:
      top: "#000000"
      bottom: "#000000"

  horizon:
    color: "#000000"
    glow: false

  road:
    surface: "#111111"
    surface_alt: "#1a1a1a"
    border: "#ffffff"
    center_line: "#333333"
    lane_markers: "#222222"

  lanes:
    colors:
      - "#ffffff"
      - "#ffffff"
      - "#ffffff"
      - "#ffffff"
      - "#ffffff"
      - "#ffffff"

  sprites:
    kick:
      shape: "floor_block"
      scale: 1.0
    snare:
      shape: "floor_double"
      scale: 1.0
    hat:
      shape: "floor_dot"
      scale: 1.0
    clap:
      shape: "floor_triple"
      scale: 1.0
    synth_low:
      shape: "floor_outline"
      scale: 1.0
    synth_high:
      shape: "floor_line"
      scale: 1.0

  gate:
    color: "#ffffff"
    opacity: 0.6
    flash_on_cross: true
    flash_color: "#f5a623"
    flash_duration: 200

  vehicle:
    color: "#ffffff"
    outline: "#000000"
    trail: false

  effects:
    drop_flash_color: "#f5a623"
    drop_flash_duration: 80
    delete_particles: false
    delete_particle_count: 0
    speed_lines: false
    speed_lines_color: "#000000"
    speed_lines_min_speed: 999

  scenery:
    post_color: "#333333"
    post_glow: false
