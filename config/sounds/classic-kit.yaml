sound_kit:
  name: "Classic Kit"

  landscape:
    lanes:
      - name: "Kick"
        type: "oscillator"
        waveform: "sine"
        volume: 1.0
        polyphony: "mono"

      - name: "Snare"
        type: "oscillator"
        waveform: "triangle"
        volume: 0.9
        polyphony: "mono"

      - name: "Hi-Hat"
        type: "oscillator"
        waveform: "square"
        volume: 0.7
        polyphony: "poly"

      - name: "Clap"
        type: "oscillator"
        waveform: "square"
        volume: 0.75
        polyphony: "mono"

      - name: "Synth Low"
        type: "oscillator"
        waveform: "sawtooth"
        note: "C3"
        volume: 0.75
        polyphony: "mono"

      - name: "Synth High"
        type: "oscillator"
        waveform: "sine"
        note: "C4"
        volume: 0.7
        polyphony: "mono"

  drive:
    enabled: true
    toggle_key: "d"
    waveform: "sawtooth"
    scale:
      root: "C"
      type: "minor_pentatonic"
      notes: ["C3", "Eb3", "G3", "Bb3", "C4", "Eb4"]
    filter:
      type: "lowpass"
      min_frequency: 200
      max_frequency: 8000
      resonance: 8
    portamento: 0.05
    volume: 0.4
