sound_kit:
  name: "Classic Kit"

  landscape:
    lanes:
      - name: "Kick"
        type: "oscillator"
        waveform: "sine"
        volume: 1.0
        polyphony: "mono"

      - name: "Snare"
        type: "oscillator"
        waveform: "triangle"
        volume: 0.9
        polyphony: "mono"

      - name: "Hi-Hat"
        type: "oscillator"
        waveform: "square"
        volume: 0.7
        polyphony: "poly"

      - name: "Clap"
        type: "oscillator"
        waveform: "square"
        volume: 0.75
        polyphony: "mono"

      - name: "Synth Low"
        type: "oscillator"
        waveform: "sawtooth"
        note: "C3"
        volume: 0.75
        polyphony: "mono"

      - name: "Synth High"
        type: "oscillator"
        waveform: "sine"
        note: "C4"
        volume: 0.7
        polyphony: "mono"

  drive:
    enabled: true
    toggle_key: "d"
    waveform: "sawtooth"
    scale:
      root: "C"
      type: "minor_pentatonic"
      notes: ["C3", "Eb3", "G3", "Bb3", "C4", "Eb4"]
    filter:
      type: "lowpass"
      min_frequency: 200
      max_frequency: 8000
      resonance: 8
    portamento: 0.05
    volume: 0.2
    presets:
      - id: "vangelis"
        name: "Cosmos (Vangelis)"
        module: "analog_dual"
        detune: 15
        waveform: "sawtooth"
        filter_min: 300
        filter_max: 6000
        resonance: 2
        portamento: 0.15
      - id: "laurie"
        name: "Algorithmic (Spiegel)"
        module: "fm_bell"
        waveform: "triangle"
        filter_min: 150
        filter_max: 2000
        resonance: 5
        portamento: 0.01
      - id: "moroder"
        name: "Driving (Moroder)"
        module: "bass_pulse"
        waveform: "square"
        filter_min: 200
        filter_max: 4000
        resonance: 15
        portamento: 0.05
      - id: "daft"
        name: "Robotic (Daft Punk)"
        module: "robot_phase"
        waveform: "sawtooth"
        filter_min: 100
        filter_max: 8000
        resonance: 20
        portamento: 0.05
      - id: "kraftwerk"
        name: "Autobahn (Kraftwerk)"
        module: "industrial_pwm"
        waveform: "square"
        filter_min: 100
        filter_max: 2500
        resonance: 5
        portamento: 0.00
      - id: "space_lady"
        name: "Casio (Space Lady)"
        module: "lofi_casio"
        waveform: "sine"
        filter_min: 150
        filter_max: 1500
        resonance: 1
        portamento: 0.10
